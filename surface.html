<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<title>Surface World (dev)</title>
		<style>
			body { margin: 0; overflow: hidden; }
		</style>
	</head>
	
	<body>
		<!---- Temp test page for displaying the surface world! Delete once worlds are wired into main.js. ---->
		<script type="module">
			import * as THREE from 'three';
			import { SurfaceWorld } from './src/worlds/SurfaceWorld.js';

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
			renderer.setSize(window.innerWidth, window.innerHeight);
			document.body.appendChild(renderer.domElement);

			// Test planet params; later these come from the planet you landed on in space.
			const world = new SurfaceWorld(renderer);
			world.enter({ groundColor: 0xc2734a, skyColor: 0xf0c8a0 });

			window.addEventListener('resize', () => {
				world.onResize(window.innerWidth, window.innerHeight);
				renderer.setSize(window.innerWidth, window.innerHeight);
			});

			let lastTime = performance.now();
			renderer.setAnimationLoop((time) => {
				// Seconds since last frame, capped so a background tab doesn't cause a huge jump on return
				const dt = Math.min((time - lastTime) / 1000, 0.05);
				lastTime = time;

				world.update(dt);
				renderer.render(world.scene, world.camera);
			});
		</script>
	</body>
</html>
